<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MP4 Converter — Audio Extractor & Muter</title>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<style>
  :root{
    --bg:#12141a;
    --panel:#1b1e26;
    --line:#2a2e38;
    --text:#edeff2;
    --sub:#8b93a1;
    --accent:#5eead4;
    --accent-dim:#2f4a46;
    --danger:#ff6b6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .card{
    width:100%;
    max-width:520px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px;
  }
  h1{
    font-size:20px;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .desc{
    color:var(--sub);
    font-size:14px;
    line-height:1.5;
    margin:0 0 22px;
  }
  .dropzone{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:28px 16px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .dropzone.drag{
    border-color:var(--accent);
    background:rgba(94,234,212,0.06);
  }
  .dropzone p{
    margin:0;
    font-size:14px;
    color:var(--sub);
  }
  .dropzone p.filename{
    color:var(--text);
    font-weight:500;
    word-break:break-all;
  }
  input[type=file]{display:none;}
  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
  }
  button{
    font:inherit;
    font-size:14px;
    font-weight:600;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, opacity .15s ease;
  }
  button:hover:not(:disabled){
    border-color:var(--accent);
  }
  button.primary{
    background:var(--accent);
    color:#0a1512;
    border-color:var(--accent);
  }
  button.primary:hover:not(:disabled){
    opacity:.9;
  }
  button:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .status{
    margin-top:18px;
    font-size:13px;
    color:var(--sub);
    min-height:18px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .bar-track{
    margin-top:8px;
    height:6px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
    display:none;
  }
  .bar-track.show{display:block;}
  .bar-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .15s ease;
  }
  a.download{
    display:none;
    margin-top:16px;
    text-align:center;
    padding:12px;
    border-radius:8px;
    background:var(--accent-dim);
    color:var(--accent);
    text-decoration:none;
    font-weight:600;
    font-size:14px;
  }
  a.download.show{display:block;}
  .spinner{
    width:12px;height:12px;
    border-radius:50%;
    border:2px solid var(--line);
    border-top-color:var(--accent);
    animation:spin .7s linear infinite;
    display:none;
  }
  .spinner.show{display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="card">
  <h1>MP4 → MP3 / Bisukan Video</h1>
  <p class="desc">Semua proses jalan langsung di browser kamu — file tidak diupload ke server manapun. Pilih file MP4, lalu pilih mau diambil audionya jadi MP3, atau videonya dibuat bisu (tanpa suara).</p>

  <div class="dropzone" id="dropzone">
    <p id="dzText">Klik atau seret file .mp4 ke sini</p>
  </div>
  <input type="file" id="fileInput" accept="video/mp4,.mp4">

  <div class="actions">
    <button id="btnMp3" disabled>Jadikan MP3</button>
    <button id="btnMute" disabled>Hapus Audio</button>
  </div>

  <div class="status">
    <span class="spinner" id="spinner"></span>
    <span id="statusText"></span>
  </div>
  <div class="bar-track" id="barTrack"><div class="bar-fill" id="barFill"></div></div>

  <a class="download" id="downloadLink">Download hasil</a>
</div>

<script>
const { createFFmpeg, fetchFile } = FFmpeg;
const ffmpeg = createFFmpeg({
  log: false,
  corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
});

const dropzone   = document.getElementById('dropzone');
const dzText     = document.getElementById('dzText');
const fileInput  = document.getElementById('fileInput');
const btnMp3     = document.getElementById('btnMp3');
const btnMute    = document.getElementById('btnMute');
const statusText = document.getElementById('statusText');
const spinner    = document.getElementById('spinner');
const barTrack   = document.getElementById('barTrack');
const barFill    = document.getElementById('barFill');
const downloadLink = document.getElementById('downloadLink');

let currentFile = null;
let ffmpegReady = false;

function setStatus(msg, busy){
  statusText.textContent = msg || '';
  spinner.classList.toggle('show', !!busy);
}

function setProgress(ratio){
  if(ratio == null){
    barTrack.classList.remove('show');
    return;
  }
  barTrack.classList.add('show');
  barFill.style.width = Math.min(100, Math.max(0, ratio*100)) + '%';
}

function pickFile(file){
  if(!file) return;
  if(!file.type.includes('mp4') && !file.name.toLowerCase().endsWith('.mp4')){
    setStatus('File harus berformat .mp4 ya.');
    return;
  }
  currentFile = file;
  dzText.textContent = file.name;
  dzText.classList.add('filename');
  btnMp3.disabled = false;
  btnMute.disabled = false;
  downloadLink.classList.remove('show');
  setStatus('');
}

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => pickFile(e.target.files[0]));

['dragover','dragenter'].forEach(ev => dropzone.addEventListener(ev, e => {
  e.preventDefault();
  dropzone.classList.add('drag');
}));
['dragleave','drop'].forEach(ev => dropzone.addEventListener(ev, e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
}));
dropzone.addEventListener('drop', e => pickFile(e.dataTransfer.files[0]));

async function ensureFfmpeg(){
  if(ffmpegReady) return;
  setStatus('Memuat mesin konversi (sekali saja)...', true);
  ffmpeg.setProgress(({ ratio }) => setProgress(ratio));
  await ffmpeg.load();
  ffmpegReady = true;
}

function baseName(name){
  return name.replace(/\.[^/.]+$/, '');
}

async function runJob(outName, args, mime, btn){
  if(!currentFile) return;
  btnMp3.disabled = true;
  btnMute.disabled = true;
  downloadLink.classList.remove('show');
  try{
    await ensureFfmpeg();
    setStatus('Memproses "' + currentFile.name + '"...', true);
    ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(currentFile));
    await ffmpeg.run('-i', 'input.mp4', ...args, outName);
    const data = ffmpeg.FS('readFile', outName);
    const blob = new Blob([data.buffer], { type: mime });
    const url = URL.createObjectURL(blob);
    downloadLink.href = url;
    downloadLink.download = outName;
    downloadLink.textContent = 'Download ' + outName;
    downloadLink.classList.add('show');
    setStatus('Selesai.', false);
    setProgress(null);
    ffmpeg.FS('unlink', 'input.mp4');
    ffmpeg.FS('unlink', outName);
  }catch(err){
    console.error(err);
    setStatus('Gagal memproses file. Coba file lain atau reload halaman.', false);
    setProgress(null);
  }finally{
    btnMp3.disabled = false;
    btnMute.disabled = false;
  }
}

btnMp3.addEventListener('click', () => {
  const out = baseName(currentFile.name) + '.mp3';
  runJob(out, ['-vn', '-acodec', 'libmp3lame', '-q:a', '2'], 'audio/mpeg');
});

btnMute.addEventListener('click', () => {
  const out = baseName(currentFile.name) + '-bisu.mp4';
  runJob(out, ['-c:v', 'copy', '-an'], 'video/mp4');
});
</script>

</body>
</html>
